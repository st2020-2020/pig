server_tokens off;
client_max_body_size 64m;
server {
    listen 85;
    server_name _;

    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css application/javascript application/json;
    gzip_vary on;

    root /data;
    index index.html;

    # 入口页必须每次回源确认：部署后普通刷新一次就能拿到新版本，
    # 不会拿着缓存里的旧 index.html 去加载已不存在的旧资源（白屏）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带内容 hash 的构建产物可以长期缓存：文件名变了自然失效。
    # 只匹配 assets 顶层的 hash 文件；public/ 拷进来的无 hash 资源在子目录里
    # （assets/fonts/、assets/iconfont/、assets/styles/），不受这条影响
    location ~* ^/assets/[^/]+\.[0-9a-zA-Z_-]{8,}\.(js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://pig-boot:9999/;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        location ~* (actuator|swagger|v3/api-docs|doc\.html|druid) {
            return 403;
        }
    }
}
