name: pig
services:
  pig-mysql:
    image: mysql:8.0
    container_name: pig-mysql
    restart: always
    command: --lower_case_table_names=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-name-resolve --performance-schema=OFF --innodb-buffer-pool-size=128M --max-connections=120
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - pig-mysql-data:/var/lib/mysql
      - /opt/pig/db/pig.sql:/docker-entrypoint-initdb.d/pig.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -proot -e \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 700M
    networks: [pig-net]

  pig-redis:
    image: redis:7-alpine
    container_name: pig-redis
    restart: always
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M
    networks: [pig-net]

  pig-boot:
    image: eclipse-temurin:17-jre
    container_name: pig-boot
    restart: always
    depends_on:
      pig-mysql:
        condition: service_healthy
      pig-redis:
        condition: service_healthy
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms192m -Xmx448m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -Djava.security.egd=file:/dev/./urandom"
    volumes:
      - /opt/pig/pig-boot/target/pig-boot.jar:/app/app.jar:ro
      - pig-upload:/app/upload
    command: ["sh","-c","java $JAVA_OPTS -jar /app/app.jar --file.local.base-path=/app/upload"]
    deploy:
      resources:
        limits:
          memory: 900M
    networks: [pig-net]

  pig-ui:
    image: nginx:1.27-alpine
    container_name: pig-ui
    restart: always
    depends_on: [pig-boot]
    ports:
      - "85:85"
    volumes:
      - /opt/pig-ui/dist:/data:ro
      - /opt/pig-deploy/pig-ui.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 96M
    networks: [pig-net]

volumes:
  pig-mysql-data:
    name: pig-mysql-data
  pig-upload:
    name: pig-upload

networks:
  pig-net:
    name: pig-net
    driver: bridge
